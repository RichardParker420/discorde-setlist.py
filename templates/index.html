<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ banda.nombre }} — Setlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface2: #1c1c1c;
            --accent: #e8c84a;
            --accent2: #c9a82a;
            --text: #f0f0f0;
            --muted: #888;
            --border: #2a2a2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 1rem 4rem;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            position: relative;
        }

        .band-photo-wrap {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--accent);
            box-shadow: 0 0 30px rgba(232, 200, 74, 0.2);
            cursor: zoom-in;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .band-photo-wrap:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(232, 200, 74, 0.35);
        }

        .band-photo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ZOOM OVERLAY */
        .zoom-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            pointer-events: none;
            transition: background 0.3s ease;
        }

        .zoom-overlay.active {
            background: rgba(0, 0, 0, 0.88);
            pointer-events: all;
        }

        .zoom-overlay img {
            max-width: 88vw;
            max-height: 82vh;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            transform: scale(0.85);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }

        .zoom-overlay.active img {
            transform: scale(1);
            opacity: 1;
        }

        .zoom-close {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            width: 38px;
            height: 38px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--muted);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.25s ease 0.1s, background 0.2s, color 0.2s;
        }

        .zoom-overlay.active .zoom-close {
            opacity: 1;
        }

        .zoom-close:hover {
            background: var(--surface);
            color: var(--text);
        }

        .zoom-hint {
            position: absolute;
            bottom: 1.5rem;
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.25s ease 0.15s;
        }

        .zoom-overlay.active .zoom-hint { opacity: 1; }

        .band-photo-placeholder {
            width: 100%;
            height: 100%;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.8rem, 10vw, 4.5rem);
            letter-spacing: 0.06em;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0.4rem;
            text-shadow: 0 0 40px rgba(232, 200, 74, 0.15);
        }

        .subtitle {
            font-size: 0.78rem;
            color: var(--muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 0 auto 2.5rem;
            max-width: 300px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider span {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--muted);
        }

        /* SETLIST */
        .setlist {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .song-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
            animation: fadeUp 0.4s ease both;
        }

        .song-card:hover {
            border-color: #3a3a3a;
        }

        .song-card.open {
            border-color: var(--accent2);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .song-btn {
            width: 100%;
            background: none;
            border: none;
            cursor: pointer;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-align: left;
            color: var(--text);
        }

        .song-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            color: var(--accent);
            min-width: 2rem;
            line-height: 1;
        }

        .song-title {
            font-size: 1rem;
            font-weight: 500;
            flex: 1;
            letter-spacing: 0.01em;
        }

        .song-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--accent);
            flex-shrink: 0;
            transition: transform 0.3s ease, background 0.2s, border-color 0.2s;
        }

        .song-card.open .song-icon {
            transform: rotate(45deg);
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .song-letra {
            display: none;
            padding: 0 1.2rem 1.4rem 1.2rem;
            border-top: 1px solid var(--border);
            margin-top: 0;
        }

        .song-letra.visible {
            display: block;
            animation: expandDown 0.25s ease;
        }

        @keyframes expandDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .letra-text {
            white-space: pre-line;
            font-size: 0.88rem;
            line-height: 1.9;
            color: #aaa;
            padding-top: 1rem;
        }

        /* Highlight section labels like "Coro", "Verso", etc. */
        .section-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: var(--accent);
            display: block;
            margin-top: 0.8rem;
            margin-bottom: 0.1rem;
        }

        /* LIVE MODE */
        .live-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 50;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 0.7rem 1.2rem;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .live-bar.visible { display: flex; }

        .live-dot {
            width: 8px; height: 8px;
            background: #e84a4a;
            border-radius: 50%;
            animation: pulse 1.2s ease infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.8); }
        }

        .live-label {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: #e84a4a;
            font-weight: 500;
            text-transform: uppercase;
        }

        .live-song-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            color: var(--text);
            letter-spacing: 0.05em;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .live-timer {
            font-size: 0.8rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            min-width: 3rem;
            text-align: right;
        }

        .live-progress {
            position: fixed;
            top: 0; left: 0;
            height: 2px;
            background: var(--accent);
            z-index: 51;
            transition: width 1s linear;
            width: 0%;
        }

        /* Active song highlight */
        .song-card.active-song {
            border-color: var(--accent) !important;
            background: #1a1700;
        }

        .song-card.active-song .song-number { color: var(--accent); }
        .song-card.active-song .song-title  { color: var(--white); }

        .song-card.played-song {
            opacity: 0.45;
        }

        /* Live start button */
        .live-start-wrap {
            text-align: center;
            margin: 1.5rem 0 0.5rem;
        }

        .btn-live {
            background: none;
            border: 1px solid #e84a4a;
            color: #e84a4a;
            padding: 0.6rem 1.4rem;
            border-radius: 20px;
            font-size: 0.78rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: background 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-live:hover { background: rgba(232,74,74,0.1); }

        .btn-live.on {
            background: #e84a4a;
            color: #fff;
        }

        footer {
            text-align: center;
            padding-top: 3rem;
            font-size: 0.72rem;
            color: #444;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
<!-- PROGRESS BAR -->
<div class="live-progress" id="live-progress"></div>

<!-- LIVE BAR -->
<div class="live-bar" id="live-bar">
    <div class="live-dot"></div>
    <span class="live-label">En vivo</span>
    <span class="live-song-name" id="live-song-name">—</span>
    <span class="live-timer" id="live-timer">0:00</span>
</div>

<div class="wrapper">

    <!-- ZOOM OVERLAY -->
    <div class="zoom-overlay" id="zoom-overlay" onclick="cerrarZoom()">
        <button class="zoom-close" onclick="cerrarZoom()" aria-label="Cerrar">✕</button>
        <img src="{{ banda.imagen_url }}" alt="{{ banda.nombre }}" id="zoom-img">
        <p class="zoom-hint">Toca para cerrar</p>
    </div>

    <header>
        <div class="band-photo-wrap" onclick="abrirZoom()" role="button" aria-label="Ver foto en grande">
            <img src="{{ banda.imagen_url }}" alt="{{ banda.nombre }}"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="band-photo-placeholder" style="display:none;">🎸</div>
        </div>

        <h1>{{ banda.nombre }}</h1>
        <p class="subtitle">Sigue la letra en vivo</p>

        <div class="divider"><span>Setlist</span></div>

        <div class="live-start-wrap">
            <button class="btn-live" id="btn-live" onclick="toggleLive()">
                <span id="live-btn-dot">●</span>
                <span id="live-btn-text">Iniciar modo en vivo</span>
            </button>
        </div>
    </header>

    <main class="setlist">
        {% for item in banda.setlist %}
        <div class="song-card" id="card-{{ loop.index }}" data-duracion="{{ item.duracion }}" style="animation-delay: {{ (loop.index0 * 0.05)|round(2) }}s">
            <button class="song-btn" onclick="toggleCancion({{ loop.index }})" aria-expanded="false" id="btn-{{ loop.index }}">
                <span class="song-number">{{ '%02d' % loop.index }}</span>
                <span class="song-title">{{ item.titulo }}</span>
                <span class="song-icon" id="icon-{{ loop.index }}">+</span>
            </button>
            <div class="song-letra" id="letra-{{ loop.index }}">
                <div class="letra-text" id="texto-{{ loop.index }}"></div>
            </div>
        </div>
        {% endfor %}
    </main>

    <footer>
        <p>{{ banda.nombre }} &mdash; todos los derechos reservados</p>
    </footer>

</div>

<script>
    // ── LIVE MODE ──────────────────────────────────────────
    let liveActivo    = false;
    let cancionActual = 0;
    let timerInterval = null;
    let segundosRestantes = 0;
    let totalSegundos = 0;

    const cards = Array.from(document.querySelectorAll('.song-card'));
    const duraciones = cards.map(c => parseInt(c.dataset.duracion) || 180);
    const titulos    = cards.map(c => c.querySelector('.song-title').textContent);

    function toggleLive() {
        if (!liveActivo) iniciarLive();
        else detenerLive();
    }

    function iniciarLive() {
        liveActivo = true;
        cancionActual = 0;

        document.getElementById('btn-live').classList.add('on');
        document.getElementById('live-btn-text').textContent = 'Detener modo en vivo';
        document.getElementById('live-bar').classList.add('visible');
        document.querySelector('.wrapper').style.paddingTop = '3.5rem';

        activarCancion(0);
    }

    function detenerLive() {
        liveActivo = false;
        clearInterval(timerInterval);

        document.getElementById('btn-live').classList.remove('on');
        document.getElementById('live-btn-text').textContent = 'Iniciar modo en vivo';
        document.getElementById('live-bar').classList.remove('visible');
        document.getElementById('live-progress').style.width = '0%';
        document.querySelector('.wrapper').style.paddingTop = '';

        cards.forEach(c => {
            c.classList.remove('active-song', 'played-song');
        });
    }

    function activarCancion(idx) {
        if (idx >= cards.length) {
            detenerLive();
            return;
        }

        cancionActual = idx;
        totalSegundos = duraciones[idx];
        segundosRestantes = totalSegundos;

        // Actualizar estilos
        cards.forEach((c, i) => {
            c.classList.remove('active-song');
            if (i < idx)  c.classList.add('played-song');
            if (i >= idx) c.classList.remove('played-song');
        });
        cards[idx].classList.add('active-song');

        // Abrir letra de la canción activa
        toggleCancion(idx + 1);

        // Scroll a la canción activa
        setTimeout(() => {
            cards[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);

        // Actualizar live bar
        document.getElementById('live-song-name').textContent = titulos[idx];
        actualizarTimer();

        // Iniciar countdown
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            segundosRestantes--;
            actualizarTimer();

            const progreso = ((totalSegundos - segundosRestantes) / totalSegundos) * 100;
            document.getElementById('live-progress').style.width = progreso + '%';

            if (segundosRestantes <= 0) {
                clearInterval(timerInterval);
                setTimeout(() => activarCancion(cancionActual + 1), 500);
            }
        }, 1000);
    }

    function actualizarTimer() {
        const m = Math.floor(segundosRestantes / 60);
        const s = segundosRestantes % 60;
        document.getElementById('live-timer').textContent =
            m + ':' + String(s).padStart(2, '0');
    }

    // ── ZOOM ──────────────────────────────────────────────
    function abrirZoom() {
        const overlay = document.getElementById('zoom-overlay');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function cerrarZoom() {
        const overlay = document.getElementById('zoom-overlay');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    }

    // Cerrar con tecla Escape
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') cerrarZoom();
    });

    // Letras raw desde Jinja (escapadas para JS)
    const letras = {
        {% for item in banda.setlist %}
        {{ loop.index }}: {{ item.letra | tojson }},
        {% endfor %}
    };

    // Sección labels a resaltar
    const secciones = ['Verso', 'Coro', 'Puente', 'Intro', 'Outro', 'Coro Final', 'Bridge', 'Pre-Coro'];

    function formatearLetra(texto) {
        const lineas = texto.split('\n');
        return lineas.map(linea => {
            const trimmed = linea.trim();
            if (secciones.some(s => trimmed === s || trimmed === s + ':')) {
                return `<span class="section-label">${trimmed}</span>`;
            }
            return linea === '' ? '\n' : linea;
        }).join('\n');
    }

    function toggleCancion(id) {
        const card  = document.getElementById('card-' + id);
        const letra = document.getElementById('letra-' + id);
        const icon  = document.getElementById('icon-' + id);
        const btn   = document.getElementById('btn-' + id);
        const texto = document.getElementById('texto-' + id);

        const abierto = card.classList.contains('open');

        // Cerrar todos
        document.querySelectorAll('.song-card.open').forEach(c => {
            c.classList.remove('open');
            c.querySelector('.song-letra').classList.remove('visible');
            c.querySelector('.song-icon').textContent = '+';
            c.querySelector('.song-btn').setAttribute('aria-expanded', 'false');
        });

        if (!abierto) {
            card.classList.add('open');
            letra.classList.add('visible');
            icon.textContent = '+';
            btn.setAttribute('aria-expanded', 'true');

            // Renderizar letra con secciones resaltadas
            if (!texto.innerHTML) {
                texto.innerHTML = formatearLetra(letras[id]);
            }

            // Scroll suave a la canción
            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 80);
        }
    }
</script>
</body>
</html>
