<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ banda.nombre }} — Setlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════
           COLORES  —  cambia aquí tu paleta
           ═══════════════════════════════════════════ */

        /* TEMA · FESTIVAL  (póster retro) — naranja, lima, azul cielo, lila, amarillo, negro */
        :root {
            --bg:        #ff6a1a;   /* naranja */
            --surface:   #fff8dc;   /* crema */
            --surface2:  #ffe9a8;
            --accent:    #d93d00;   /* naranja quemado (texto sobre crema) */
            --accent2:   #1e90c8;   /* azul cielo */
            --on-accent: #ffffff;
            --highlight: #f6d800;   /* amarillo */
            --text:      #151515;
            --muted:     #2b1a10;
            --border:    #151515;   /* contornos negros gruesos */
            --live:      #d93d00;
            --pat1:      rgba(21, 21, 21, 0.16);
            --pat2:      rgba(246, 216, 0, 0.9);

            --h1-color:    #f6d800;
            --h1-shadow:   3px 3px 0 #151515, -1px -1px 0 #151515, 1px -1px 0 #151515, -1px 1px 0 #151515, 1px 1px 0 #151515;
            --divider:     #151515;
            --card-shadow: 4px 4px 0 #151515;   /* sombra dura estilo póster */

            /* puntos de semitono */
            --pattern:
                radial-gradient(circle, var(--pat1) 1.6px, transparent 2.1px);
            --pattern-size: 12px 12px;

            /* franja de tablero, disco de vinilo, manchas lima/azul/lila y un aro amarillo */
            --shapes:
                conic-gradient(#151515 25%, #f6d800 0 50%, #151515 0 75%, #f6d800 0) 0 0 / 28px 28px repeat-x,
                radial-gradient(circle at 95% 9%, #f6d800 0 5px, #ff6a1a 6px 20px, #151515 21px 23px, #3a3a3a 24px 25px, #151515 26px 29px, #3a3a3a 30px 31px, #151515 32px 72px, transparent 73px),
                radial-gradient(circle at 8% 14%, transparent 0 24px, #f6d800 25px 30px, transparent 31px),
                radial-gradient(ellipse 150px 100px at -2% 42%, #d9a0f5 99%, transparent 100%),
                radial-gradient(circle at 100% 70%, #29a8e0 0 70px, transparent 71px),
                radial-gradient(circle at 3% 94%, #8be04a 0 120px, transparent 121px),
                radial-gradient(circle at 22% 104%, #29a8e0 0 90px, transparent 91px);
        }

        /* ═══════════════════════════════════════════ */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Textura de fondo (patrón repetido) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: var(--pattern);
            background-size: var(--pattern-size);
            pointer-events: none;
            z-index: 0;
        }

        /* Formas grandes de fondo */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: var(--shapes);
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 1rem 4rem;
        }

        .song-btn:focus-visible,
        .btn-live:focus-visible,
        .band-photo-wrap:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        /* ── HEADER ── */
        header {
            text-align: center;
            padding: 3.5rem 1rem 2rem;
            position: relative;
        }

        .band-photo-wrap {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent);
            box-shadow: 0 0 0 6px var(--surface), 0 10px 30px var(--pat2);
            cursor: zoom-in;
            transition: transform 0.2s ease;
        }

        .band-photo-wrap:hover { transform: scale(1.05); }

        .band-photo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .band-photo-placeholder {
            width: 100%;
            height: 100%;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.8rem, 10vw, 4.5rem);
            letter-spacing: 0.06em;
            color: var(--h1-color, var(--accent));
            text-shadow: var(--h1-shadow, none);
            line-height: 1;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--muted);
            letter-spacing: 0.12em;
            margin-bottom: 2rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 0 auto 2rem;
            max-width: 300px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: var(--border);
            border-radius: 2px;
        }
        .divider span {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.25em;
            color: var(--divider, var(--accent2));
        }

        /* ── ZOOM FOTO ── */
        .zoom-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            pointer-events: none;
            transition: background 0.3s ease;
        }

        .zoom-overlay.active {
            background: rgba(20, 25, 20, 0.85);
            pointer-events: all;
        }

        .zoom-overlay img {
            max-width: 88vw;
            max-height: 82vh;
            border-radius: 16px;
            border: 4px solid var(--surface);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            transform: scale(0.85);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }

        .zoom-overlay.active img { transform: scale(1); opacity: 1; }

        .zoom-close {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            width: 38px;
            height: 38px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 50%;
            color: var(--text);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.25s ease 0.1s;
        }

        .zoom-overlay.active .zoom-close { opacity: 1; }

        .zoom-hint {
            position: absolute;
            bottom: 1.5rem;
            font-size: 0.8rem;
            color: #e8e8e8;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.25s ease 0.15s;
        }

        .zoom-overlay.active .zoom-hint { opacity: 1; }

        /* ── SETLIST ── */
        .setlist {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .song-card {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow, none);
            transition: border-color 0.2s, background 0.2s, opacity 0.3s;
        }

        .song-card:hover { border-color: var(--accent2); }
        .song-card.open  { border-color: var(--accent); }

        .song-btn {
            width: 100%;
            background: none;
            border: none;
            cursor: pointer;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-align: left;
            color: var(--text);
            font-family: inherit;
        }

        .song-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            color: var(--accent);
            min-width: 2rem;
            line-height: 1;
        }

        .song-title {
            font-size: 1.02rem;
            font-weight: 500;
            flex: 1;
        }

        .song-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--accent2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            line-height: 1;
            color: var(--accent);
            flex-shrink: 0;
            transition: transform 0.3s ease, background 0.2s, border-color 0.2s, color 0.2s;
        }

        .song-card.open .song-icon {
            transform: rotate(45deg);
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        .song-letra {
            display: none;
            padding: 0 1.2rem 1.4rem;
            border-top: 2px dashed var(--border);
        }

        .song-letra.visible {
            display: block;
            animation: expandDown 0.25s ease;
        }

        @keyframes expandDown {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .letra-text {
            white-space: pre-line;
            font-size: 0.95rem;
            line-height: 1.9;
            color: var(--text);
            padding-top: 1rem;
        }

        .section-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.2em;
            color: var(--accent);
            display: block;
            margin-top: 0.8rem;
            margin-bottom: 0.1rem;
        }

        /* ── MODO EN VIVO ── */
        .live-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 50;
            background: var(--surface);
            border-bottom: 2px solid var(--border);
            padding: 0.7rem 1.2rem;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .live-bar.visible { display: flex; }

        .live-dot {
            width: 9px; height: 9px;
            background: var(--live);
            border-radius: 50%;
            animation: pulse 1.2s ease infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(0.8); }
        }

        .live-label {
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            color: var(--live);
            font-weight: 500;
        }

        .live-song-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            color: var(--text);
            letter-spacing: 0.05em;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .live-timer {
            font-size: 0.85rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            min-width: 3rem;
            text-align: right;
        }

        .live-progress {
            position: fixed;
            top: 0; left: 0;
            height: 3px;
            background: var(--accent);
            z-index: 51;
            transition: width 1s linear;
            width: 0%;
        }

        .song-card.active-song {
            border-color: var(--accent) !important;
            background: var(--highlight);
        }

        .song-card.played-song { opacity: 0.5; }

        .live-start-wrap {
            text-align: center;
            margin: 1.5rem 0 0.5rem;
        }

        .btn-live {
            background: var(--surface);
            border: 2px solid var(--live);
            color: var(--live);
            padding: 0.6rem 1.4rem;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-live:hover { background: var(--highlight); }

        .btn-live.on {
            background: var(--live);
            color: #fff;
        }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding-top: 3rem;
            padding-bottom: 1rem;
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        .ig-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            padding: 0.55rem 1.2rem;
            border: 2px solid var(--border);
            background: var(--surface);
            border-radius: 20px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.85rem;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }

        .ig-link:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--highlight);
        }

        .ig-icon { width: 18px; height: 18px; flex-shrink: 0; }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
<!-- BARRA DE PROGRESO -->
<div class="live-progress" id="live-progress"></div>

<!-- BARRA EN VIVO -->
<div class="live-bar" id="live-bar">
    <div class="live-dot"></div>
    <span class="live-label">En vivo</span>
    <span class="live-song-name" id="live-song-name">—</span>
    <span class="live-timer" id="live-timer">0:00</span>
</div>

<div class="wrapper">

    <!-- ZOOM FOTO -->
    <div class="zoom-overlay" id="zoom-overlay" onclick="cerrarZoom()">
        <button class="zoom-close" onclick="cerrarZoom()" aria-label="Cerrar">✕</button>
        <img src="{{ banda.imagen_url }}" alt="{{ banda.nombre }}" id="zoom-img">
        <p class="zoom-hint">Toca para cerrar</p>
    </div>

    <header>
        <div class="band-photo-wrap" onclick="abrirZoom()" role="button" tabindex="0" aria-label="Ver foto en grande">
            <img src="{{ banda.imagen_url }}" alt="{{ banda.nombre }}"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="band-photo-placeholder" style="display:none;">🎸</div>
        </div>

        <h1>{{ banda.nombre }}</h1>
        <p class="subtitle">Sigue la letra en vivo</p>

        <div class="divider"><span>Setlist</span></div>

        <div class="live-start-wrap">
            <button class="btn-live" id="btn-live" onclick="toggleLive()">
                <span>●</span>
                <span id="live-btn-text">Iniciar modo en vivo</span>
            </button>
        </div>
    </header>

    <main class="setlist">
        {% for item in banda.setlist %}
        <div class="song-card" id="card-{{ loop.index }}" data-duracion="{{ item.duracion }}">
            <button class="song-btn" onclick="toggleCancion({{ loop.index }})" aria-expanded="false" id="btn-{{ loop.index }}">
                <span class="song-number">{{ '%02d' % loop.index }}</span>
                <span class="song-title">{{ item.titulo }}</span>
                <span class="song-icon" id="icon-{{ loop.index }}">+</span>
            </button>
            <div class="song-letra" id="letra-{{ loop.index }}">
                <div class="letra-text" id="texto-{{ loop.index }}"></div>
            </div>
        </div>
        {% endfor %}
    </main>

    <footer>
        <p>{{ banda.nombre }} &mdash; todos los derechos reservados</p>
        <a class="ig-link" href="https://www.instagram.com/losdiscorde?igsh=bXVkdzZ0cHhkZDUy" target="_blank" rel="noopener">
            <svg class="ig-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <circle cx="12" cy="12" r="4"/>
                <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
            </svg>
            @losdiscorde
        </a>
    </footer>

</div>

<script>
    // ── MODO EN VIVO ───────────────────────────────────────
    let liveActivo    = false;
    let cancionActual = 0;
    let timerInterval = null;
    let segundosRestantes = 0;
    let totalSegundos = 0;

    const cards = Array.from(document.querySelectorAll('.song-card'));
    const duraciones = cards.map(c => parseInt(c.dataset.duracion) || 180);
    const titulos    = cards.map(c => c.querySelector('.song-title').textContent);

    function toggleLive() {
        if (!liveActivo) iniciarLive();
        else detenerLive();
    }

    function iniciarLive() {
        liveActivo = true;
        cancionActual = 0;

        document.getElementById('btn-live').classList.add('on');
        document.getElementById('live-btn-text').textContent = 'Detener modo en vivo';
        document.getElementById('live-bar').classList.add('visible');
        document.querySelector('.wrapper').style.paddingTop = '3.5rem';

        activarCancion(0);
    }

    function detenerLive() {
        liveActivo = false;
        clearInterval(timerInterval);

        document.getElementById('btn-live').classList.remove('on');
        document.getElementById('live-btn-text').textContent = 'Iniciar modo en vivo';
        document.getElementById('live-bar').classList.remove('visible');
        document.getElementById('live-progress').style.width = '0%';
        document.querySelector('.wrapper').style.paddingTop = '';

        cards.forEach(c => c.classList.remove('active-song', 'played-song'));
    }

    function activarCancion(idx) {
        if (idx >= cards.length) {
            detenerLive();
            return;
        }

        cancionActual = idx;
        totalSegundos = duraciones[idx];
        segundosRestantes = totalSegundos;

        cards.forEach((c, i) => {
            c.classList.remove('active-song');
            c.classList.toggle('played-song', i < idx);
        });
        cards[idx].classList.add('active-song');

        // Abre la letra de la canción activa (sin cerrarla si ya estaba abierta)
        toggleCancion(idx + 1, true);

        setTimeout(() => {
            cards[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);

        document.getElementById('live-song-name').textContent = titulos[idx];
        actualizarTimer();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            segundosRestantes--;
            actualizarTimer();

            const progreso = ((totalSegundos - segundosRestantes) / totalSegundos) * 100;
            document.getElementById('live-progress').style.width = progreso + '%';

            if (segundosRestantes <= 0) {
                clearInterval(timerInterval);
                setTimeout(() => activarCancion(cancionActual + 1), 500);
            }
        }, 1000);
    }

    function actualizarTimer() {
        const m = Math.floor(segundosRestantes / 60);
        const s = segundosRestantes % 60;
        document.getElementById('live-timer').textContent =
            m + ':' + String(s).padStart(2, '0');
    }

    // ── ZOOM FOTO ──────────────────────────────────────────
    function abrirZoom() {
        document.getElementById('zoom-overlay').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function cerrarZoom() {
        document.getElementById('zoom-overlay').classList.remove('active');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') cerrarZoom();
        if (e.key === 'Enter' && document.activeElement.classList.contains('band-photo-wrap')) abrirZoom();
    });

    // ── LETRAS ─────────────────────────────────────────────
    const letras = {
        {% for item in banda.setlist %}
        {{ loop.index }}: {{ item.letra | tojson }},
        {% endfor %}
    };

    const secciones = ['Verso', 'Coro', 'Puente', 'Intro', 'Outro', 'Coro Final', 'Bridge', 'Pre-Coro'];

    function formatearLetra(texto) {
        const lineas = texto.split('\n');
        return lineas.map(linea => {
            const trimmed = linea.trim();
            if (secciones.some(s => trimmed === s || trimmed === s + ':')) {
                return '<span class="section-label">' + trimmed + '</span>';
            }
            return linea === '' ? '\n' : linea;
        }).join('\n');
    }

    function toggleCancion(id, forzarAbrir) {
        const card  = document.getElementById('card-' + id);
        const letra = document.getElementById('letra-' + id);
        const btn   = document.getElementById('btn-' + id);
        const texto = document.getElementById('texto-' + id);

        const abierto = card.classList.contains('open');

        // Si el modo en vivo pide abrirla y ya está abierta, no hacemos nada
        if (forzarAbrir && abierto) return;

        // Cerrar todas
        document.querySelectorAll('.song-card.open').forEach(c => {
            c.classList.remove('open');
            c.querySelector('.song-letra').classList.remove('visible');
            c.querySelector('.song-btn').setAttribute('aria-expanded', 'false');
        });

        if (!abierto || forzarAbrir) {
            card.classList.add('open');
            letra.classList.add('visible');
            btn.setAttribute('aria-expanded', 'true');

            if (!texto.innerHTML) {
                texto.innerHTML = formatearLetra(letras[id]);
            }

            if (!forzarAbrir) {
                setTimeout(() => {
                    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 80);
            }
        }
    }
</script>
</body>
</html>
